# Lokale Entwicklungsdatenbank. Zugangsdaten gelten nur lokal und sind keine Geheimnisse.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: remoteslot
      POSTGRES_USER: remoteslot
      POSTGRES_PASSWORD: remoteslot
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
